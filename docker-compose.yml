# Tiers présentation : site web Flask + Jinja
services:
  web:
    build: .
    image: rt0705/videotheque-web:dev
    ports:
      - "8080:5000"
    environment:
      FLASK_RUN_PORT: "5000"
      FLASK_DEBUG: "1"
      API_URL: "http://api:5001/api"
    volumes:
      - ./app:/app
    networks:
      - videotheque_net

networks:
  videotheque_net:
    external: true
